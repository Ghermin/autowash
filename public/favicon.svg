<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Geoffrey Hermin logo">
  <!-- Soft gradient background -->
  <defs>
    <linearGradient id="softGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with soft gradient -->
  <circle cx="256" cy="256" r="256" fill="url(#softGradient)"/>
  
  <!-- Text G.H centered exactly in the circle -->
  <text x="256" y="256"
    font-family="Inter, Arial, sans-serif"
    font-weight="700"
    font-size="180"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="#f8fafc"
    style="shape-rendering:geometricPrecision;" 
    >G·H</text>
  
  <!-- Decorative underline with subtle opacity (placed relative to circle) -->
  <path d="M136 324 L376 324"
    stroke="#f8fafc"
    stroke-width="10"
    stroke-linecap="round"
    stroke-opacity="0.85"/>

  <!-- Ensure crisp rendering on export -->
  <rect width="512" height="512" fill="none" />
</svg>